<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Historillion, 2D kit: fullscreen demo v3</title>
  <link rel="icon" href="brand/favicon.png">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main id="app"></main>
  <script type="module">
    // A tiny fake game that uses the kit exactly the way main.js should (strings here stand in for js/strings/en.js).
    // ?screen=intro|ask|common|uncommon|rare|veryRare|none|end jumps to a state; &still=1 shows final frames at once; &hint=1 shows the "did you mean" line;
    // &nofocus=1 does not focus the input. Click the buttons to play through it with sound (the first tap unlocks audio).
    import { mountScene, museum, DIG, REACTIONS } from "./dig-scene.js";
    import { endCurve, rankList, findsList, nextDig, RANKS } from "./end-screen.js";
    const app = document.getElementById("app");
    const q = new URLSearchParams(location.search);
    const scene = mountScene(document.body, { still: q.has("still"), seek: q.has("at") ? Number(q.get("at")) : undefined });   // &at=1.15 freezes a dig beat at 1.15 s
    const el = (tag, props = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(props)) (k in n ? (n[k] = v) : n.setAttribute(k, v)); n.append(...kids); return n; };
    const show = (...nodes) => app.replaceChildren(...nodes);
    const names = { shard: "Pottery shard", coin: "Coin", crown: "Crown", statue: "Statue", rock: "Just a rock" };
    const sentences = { common: "You dug up a pottery shard with a brush.", uncommon: "You dug up a coin with a pickaxe.", rare: "You dug up a crown with a small excavator.", veryRare: "You dug up a statue with a dump truck.", none: "You dug up just a rock with a spoon." };
    const rarity = { common: "Common answer. 41% of players gave it.", uncommon: "Uncommon answer. 17% of players gave it.", rare: "Rare answer. 6% of players gave it.", veryRare: "Very rare answer. Under 1% of players gave it.", none: "No valid answer." };
    const rarityShort = { common: "Common", uncommon: "Uncommon", rare: "Rare", veryRare: "Very rare", none: "No answer" };
    const points = { common: 8, uncommon: 24, rare: 62, veryRare: 94, none: 0 };
    const LONG = q.has("long");                              // &long=1: the longest question and a long explanation, with accents and apostrophes
    const QUESTION = LONG ? "Name an explorer from the Age of Discovery (c. 1400 to 1600). Álvares Cabral and Ch’in-era admirals count too." : "Which Roman emperor is said to have played music while Rome burned?";
    const EXPLAIN = LONG ? "Vasco da Gama reached India by sea in 1498, Pedro Álvares Cabral landed in Brazil in 1500, and Ferdinand Magellan’s expedition completed the first circumnavigation (1519 to 1522), although Magellan himself died in the Philippines. Zheng He’s treasure fleets of the early 1400s were larger than any European fleet of the time." : "Nero was said to have played the lyre, but the fiddle did not exist yet.";
    const FIND_LIST = ["shard", "coin", "crown", "shard", "statue", "rock", "coin"];
    if (q.has("finds") && q.get("screen") !== "end") scene.setFinds(FIND_LIST.slice(0, Number(q.get("finds"))));
    let total = 0;
    const hud = (extra = {}) => scene.hud({ progress: { current: 3, total: 7 }, counter: "Question 3 of 7", score: `Score ${total}`, soundLabel: "Sound", ...extra });

    function intro() {
      scene.hud(null);
      show(el("h1", { textContent: "Historillion" }), el("p", { textContent: "A daily history game. Seven questions, twenty seconds each." }), el("p", { textContent: "The rarer your answer, the more you dig up." }), el("button", { textContent: "Start", onclick: () => { total = 0; ask(true); } }));
    }
    function ask(first = false) {
      if (first) scene.newDay();                             // a new game: the bench is emptied
      const timer = el("p", { className: "timer", role: "timer", textContent: "20 s" });
      const input = el("input", { type: "text", placeholder: "Type your answer", "aria-label": QUESTION });
      const msg = el("p", { className: "msg", role: "status" });
      const form = el("form", {}, input, el("button", { type: "submit", textContent: "Submit" }));
      form.onsubmit = (e) => { e.preventDefault(); scene.sound.play("submit"); feedback(["common", "uncommon", "rare", "veryRare", "none"][Math.floor(Math.random() * 5)]); };
      hud({ timer });
      first ? scene.ready() : scene.idle();
      if (q.has("urgent")) { scene.urgent(true); if (q.has("freeze")) { const e = document.querySelector(".urgent-edge"); e.style.animationDelay = "-0.5s"; e.style.animationPlayState = "paused"; } }                 // &urgent=1: the last-5-seconds edge pulse (&freeze=1 holds it at full strength); in the game: scene.urgent(left <= 5 && left > 0) every tick
                  // ready() only for question 1; idle() for the rest
      show(el("h2", { textContent: QUESTION }), form, msg);
      if (q.get("hint")) msg.replaceChildren("Did you mean ", el("button", { type: "button", textContent: "→ Nero" }));
      if (!q.get("nofocus")) input.focus();
    }
    function feedback(key) {
      total += points[key];
      hud();
      scene.dig(key, REACTIONS[key]);
      show(el("h2", { textContent: QUESTION }), el("p", { textContent: "Your answer: nero" }), el("p", { className: "dig", textContent: sentences[key] }),
        el("p", { className: "points", textContent: key === "none" ? "0 points" : `+${points[key]} points` }), el("p", { textContent: rarity[key] }),
        el("p", { textContent: EXPLAIN }), el("button", { textContent: "Next", onclick: () => (q.get("loop") ? ask() : end()) }));
    }
    // a fake score distribution: a bell over 0..700 in bins of 25 (in the game these come from js/distribution.js: scoreDistribution, bins, percentile)
    function fakeBins() {
      const out = [];
      for (let from = 0; from < 700; from += 25) { const c = from + 12.5; out.push({ from, to: from + 25, p: Math.exp(-((c - 300) ** 2) / (2 * 120 ** 2)) / 120 }); }
      const sum = out.reduce((s, b) => s + b.p, 0);
      return out.map((b) => ({ ...b, p: b.p / sum }));
    }
    // a mock of the "All answers" section with the classes js/answers.js uses (the real markup may differ: see FULLSCREEN.md)
    function answersMock() {
      const chip = (t, n, on) => el("button", { className: "chip", type: "button", "aria-pressed": String(!!on) }, t + " ", el("small", { textContent: n }));
      const item = (name, pts, text, now) => { const li = el("li", { className: "answer-item" + (now ? " now" : "") }, el("button", { className: "answer-row", type: "button" }, el("span", { className: "answer-name", textContent: name }), el("b", { textContent: pts })));
        if (text) li.append(el("p", { textContent: text }), el("span", { className: "answer-source" }, "Source: ", el("a", { href: "#", textContent: "Wikipedia, Cigarette" }))); return li; };
      return el("section", { className: "answers" }, el("h3", { textContent: "All answers" }),
        el("div", { className: "answer-tabs", role: "tablist" }, el("button", { role: "tab", "aria-selected": "true", type: "button", textContent: "All answers" }), el("button", { role: "tab", "aria-selected": "false", type: "button", textContent: "Your answers" })),
        el("div", { className: "answer-filters" }, chip("All", "1,130", true), chip("Very rare", "1"), chip("Rare", "112"), chip("Uncommon", "992"), chip("Common", "22")),
        el("input", { className: "answer-search", type: "search", placeholder: "Search all answers…", "aria-label": "Search all answers" }),
        el("ul", { className: "answer-list" }, item("Medicated cigarette", "+100", "Grimault’s Indian Cigarettes were advertised in 1907 for relieving asthma.", true), item("Absorbable coated sponge", "+85"), item("Abstract", "+85"), item("Adai", "+85"), item("Ampoule", "+85"), item("Anticoagulant and preservative solution for blood", "+85")),
        el("button", { className: "answer-more", type: "button", textContent: "Show more (100 of 1,130)" }));
    }
    function end() {
      scene.hud(null);
      scene.reset();
      scene.sound.play("finish");
      if (q.has("finds")) scene.setFinds(FIND_LIST.slice(0, Number(q.get("finds"))));
      const keys = ["common", "uncommon", "rare", "veryRare", "none", "rare", "common"];
      const bins = fakeBins();
      const score = q.get("score") ? Number(q.get("score")) : (total || 318);
      const pctl = bins.filter((b) => b.to <= score).reduce((s, b) => s + b.p, 0);
      const prompts = ["Name a sport where you're allowed to kick the ball", "Name a country that has an A as its second letter", "Name a city on an island (towns count too)", "Name an album by an artist with more than 1 million monthly listeners", "Name an animal with webbed feet", "Name a video game company", "Name a form medicine comes in (like a pill)"];
      const answers = ["Gaelic football", "Palau", "Reykjavik", "Late Registration", "ge", "Psyonix", "Powder"];
      if (q.get("only") === "answers") return show(answersMock());
      show(el("h1", { className: "total" }, el("span", { className: "sr", textContent: "Total: " }), String(score)), el("p", { className: "sub", textContent: "points" }),
        endCurve({ bins, total: score, percentile: pctl }),
        rankList({ total: score, ranks: RANKS, title: "Your rank" }),
        findsList({ results: keys.map((k, i) => ({ prompt: prompts[i], typed: answers[i], rarity: rarityShort[k], find: DIG[k].find, findLabel: names[DIG[k].find], pts: points[k] })), title: "Your finds", pointsLabel: "pts" }),
        nextDig({ label: "Next dig in" }),
        ...(q.has("answers") ? [answersMock()] : []),
        el("button", { textContent: "Play again", onclick: intro }));
    }
    const s = q.get("screen") ?? "intro";
    if (s === "intro") intro(); else if (s === "ask") ask(true); else if (s === "end") end(); else { ask(); feedback(s); }
  </script>
</body>
</html>
